name: WebGL SwiftShader Spike (Fase 3)

on:
  workflow_dispatch:
  push:
    branches:
      - spike/webgl-cloud

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js (pinned 22.23.5)
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'

      - name: Cache static FFmpeg 8.1.3
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static-8.1.3
          key: ffmpeg-static-8.1.3-linux64-v1

      - name: Run cloud setup
        env:
          OUT_DIR: out_webgl_spike
        run: bash cloud/setup.sh

      - name: Run WebGL vs Canvas2D Cloud Benchmark & Stills
        run: |
          node webgl_spike.mjs
          cat out_webgl_spike/spike_report.json

      - name: Upload WebGL Spike Report and Before/After Stills
        uses: actions/upload-artifact@v4
        with:
          name: webgl-spike-results
          path: |
            out_webgl_spike/spike_report.json
            out_webgl_spike/compare_*.jpg
            out_webgl_spike/*_t*.png
          retention-days: 1
          if-no-files-found: error
