name: Render 3D Shorts

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario name (e.g. submarine, a10)'
        required: true
        default: 'submarine'
        type: string
      shards:
        description: 'Number of parallel render shards'
        required: true
        default: '3'
        type: string

concurrency:
  group: render-${{ inputs.scenario || 'submarine' }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.65.1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    steps:
      - name: Build shard matrix
        id: make
        run: |
          N="${{ inputs.shards }}"
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ] || [ "$N" -gt 12 ]; then
            echo "Invalid shards=$N (must be 1..12)" >&2
            exit 1
          fi
          JSON=$(node -e "console.log(JSON.stringify(Array.from({length: Number(process.argv[1])}, (_, i) => i + 1)))" "$N")
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Shard matrix: $JSON"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache APT FFmpeg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/shorts-apt-debs
          key: apt-ffmpeg-ubuntu2404-v1

      - name: Run cloud setup
        env:
          OUT_DIR: out_cloud
        run: bash cloud/setup.sh

      - name: Render shard ${{ matrix.shard }}/${{ inputs.shards }}
        env:
          SCENARIO: ${{ inputs.scenario }}
          ASSETS_DIR: assets/${{ inputs.scenario }}
          OUT_DIR: out_cloud
          SHARDS: ${{ inputs.shards }}
          DSF: '1.5'
        run: |
          node render.mjs --shard "${{ matrix.shard }}/${{ inputs.shards }}"

      - name: Upload shard segment and metrics
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ inputs.scenario }}-${{ matrix.shard }}
          path: |
            out_cloud/shards/seg_${{ matrix.shard }}.mp4
            out_cloud/shards/metrics_${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  mux:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache APT FFmpeg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/shorts-apt-debs
          key: apt-ffmpeg-ubuntu2404-v1

      - name: Run cloud setup (cached ffmpeg + runner Chrome)
        env:
          OUT_DIR: out_cloud
        run: bash cloud/setup.sh

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ inputs.scenario }}-*
          path: out_cloud/shards
          merge-multiple: true

      - name: Mux shards with audio
        env:
          SCENARIO: ${{ inputs.scenario }}
          ASSETS_DIR: assets/${{ inputs.scenario }}
          OUT_DIR: out_cloud
          SHARDS: ${{ inputs.shards }}
          OUTPUT_MP4: demo_${{ inputs.scenario }}_v1.3.mp4
        run: |
          node mux.mjs

      - name: Run Seam Check (SHARDS=1 vs ${{ inputs.shards }}, ±3 frames = 0.0000%)
        env:
          SCENARIO: ${{ inputs.scenario }}
          ASSETS_DIR: assets/${{ inputs.scenario }}
          OUT_DIR: out_cloud
          SHARDS: ${{ inputs.shards }}
          DSF: '1.5'
        run: |
          node seam_check.mjs

      - name: Run CI Verification Gates (0.25s layout/framing/word-gap + ffprobe + ebur128)
        env:
          SCENARIO: ${{ inputs.scenario }}
          ASSETS_DIR: assets/${{ inputs.scenario }}
          OUT_DIR: out_cloud
          OUTPUT_MP4: demo_${{ inputs.scenario }}_v1.3.mp4
          DSF: '1.5'
        run: |
          node verify.mjs
          cat out_cloud/metrics.json

      - name: Upload final video and metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.scenario }}
          path: |
            out_cloud/demo_${{ inputs.scenario }}_v1.3.mp4
            out_cloud/metrics.json
          retention-days: 1
          if-no-files-found: error
